<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FORTEM Equipe</title>
  <meta name="description" content="Instale o app da equipe FORTEM na tela inicial." />
  <meta name="robots" content="noindex" />
  <link rel="manifest" href="/manifest-equipe.json" />
  <meta name="theme-color" content="#E73C3E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FORTEM Equipe" />
  <link rel="apple-touch-icon" href="/icon-equipe-192.png" />
  <link rel="icon" href="/icon-equipe-192.png" />
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#141414;color:#f2f2f2;font-family:Archivo,system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
    img{width:96px;height:96px;border-radius:22px}
    h1{font-size:20px;margin:16px 0 8px}
    p{color:#b1b3b3;font-size:15px;line-height:1.5;max-width:320px;margin:0 auto 16px}
    a{color:#f2f2f2;background:#C8282A;padding:12px 20px;display:inline-block;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <img src="/icon-equipe-192.png" alt="FORTEM Equipe" />
    <h1>FORTEM Equipe</h1>
    <p id="instrucao">Para instalar: toque em Compartilhar e depois em "Adicionar à Tela de Início" (iPhone), ou no menu do Chrome em "Instalar app" (Android).</p>
    <a href="/login">Entrar na equipe</a>
    <p style="margin-top:24px"><a href="/diagnostico-app" style="background:none;padding:0;color:#b1b3b3;font-weight:400;font-size:12px;text-decoration:underline">Diagnóstico do app</a></p>
  </main>
  <script>
    (function () {
      var nav = window.navigator;
      var displayStandalone = !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
      var standalone = nav.standalone === true || displayStandalone;
      var ua = nav.userAgent || "";
      // iOS: cada atalho tem armazenamento próprio, então a marca pode ficar no localStorage.
      // Android: os atalhos dividem o localStorage do Chrome, então só a marca da sessão.
      var ios = ("standalone" in nav) || /iPad|iPhone|iPod/.test(ua) || (nav.platform === "MacIntel" && nav.maxTouchPoints > 1);
      var marcaLocal = null;
      try { marcaLocal = localStorage.getItem("fortem_app"); } catch (e) {}
      try {
        sessionStorage.setItem("fortem_app", "equipe");
        if (ios && standalone) localStorage.setItem("fortem_app", "equipe");
      } catch (e) {}
      try {
        var lista = JSON.parse(localStorage.getItem("fortem_diag_app") || "[]");
        if (!Array.isArray(lista)) lista = [];
        lista.push({
          em: new Date().toISOString(), tipo: "abertura", origem: "equipe-app.html", pagina: "/equipe-app.html",
          standalone_nav: nav.standalone === true, display_standalone: displayStandalone, ios: ios,
          marca_local: marcaLocal, para: standalone ? "/login" : "/equipe-app.html"
        });
        localStorage.setItem("fortem_diag_app", JSON.stringify(lista.slice(-30)));
      } catch (e) {}
      if (standalone) location.replace("/login");
    })();
  </script>
</body>
</html>
